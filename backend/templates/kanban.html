    // ADD TASK

    async function addTask() {

        const token =
            localStorage.getItem("token");

        try {

            const response = await fetch(

                `${BASE_URL}/assign-task`,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({

                        project_id: 1,

                        assigned_to: 2,

                        title:
                            document.getElementById(
                                "title"
                            ).value,

                        description:
                            document.getElementById(
                                "description"
                            ).value
                    })
                }
            );

            const data =
                await response.json();

            alert(data.message);

            loadTasks();

        }

        catch(error) {

            console.log(error);

            alert("Task creation failed");
        }
    }

    // UPDATE TASK

    async function updateTask(
        taskId,
        status
    ) {

        const token =
            localStorage.getItem("token");

        try {

            await fetch(

                `${BASE_URL}/update-task/${taskId}`,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({

                        status: status
                    })
                }
            );

            loadTasks();

        }

        catch(error) {

            console.log(error);

            alert("Task update failed");
        }
    }

    // LOGOUT

    function logout() {

        localStorage.removeItem(
            "token"
        );

        window.location.href =
            "/login-page";
    }

    // INITIAL LOAD

    loadTasks();

</script>
