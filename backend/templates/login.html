<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body {

            background: #111;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            font-family: Arial;
        }

        .box {

            background: #1f1f1f;

            padding: 40px;

            border-radius: 10px;

            width: 350px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-top: 10px;
        }

        button {

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            background: orange;

            border: none;

            color: white;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>🎬 Login</h1>

        <input id="email" placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>

    <script>

        async function login() {

            const response = await fetch(

                "/login",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email:
                            document.getElementById(
                                "email"
                            ).value,

                        password:
                            document.getElementById(
                                "password"
                            ).value
                    })
                }
            );

            const data =
                await response.json();

            localStorage.setItem(
                "token",
                data.access_token
            );

            window.location.href =
                "/director-dashboard-page";
        }

    </script>

</body>

</html>
