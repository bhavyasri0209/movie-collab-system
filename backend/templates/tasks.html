<!DOCTYPE html>
<html>

<head>

    <title>My Tasks</title>

    <style>

        body {

            font-family: Arial;

            background: #f4f4f4;

            padding: 30px;
        }

        h1 {

            text-align: center;
        }

        .task {

            background: white;

            padding: 20px;

            margin-bottom: 20px;

            border-radius: 10px;

            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        button {

            padding: 10px 20px;

            border: none;

            background: green;

            color: white;

            border-radius: 5px;

            cursor: pointer;
        }
        .navbar {

    background: black;

    padding: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: white;
}

.navbar a {

    color: white;

    margin-right: 20px;

    text-decoration: none;
}

.navbar button {

    background: red;

    border: none;

    padding: 10px 20px;

    color: white;

    cursor: pointer;
}

    </style>

</head>

<body>
<nav class="navbar">

    <h2>🎬 MovieCollab</h2>

    <div>

        <a href="/">Home</a>

        <a href="/director-dashboard-page">
            Dashboard
        </a>

        <a href="/kanban">
            Tasks
        </a>

        <a href="/chat">
            Chat
        </a>

        <a href="/analytics">
            Analytics
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>
    <h1>🎬 My Tasks</h1>

    <div id="tasks"></div>

    <script>

        async function loadTasks() {

            const token =
                localStorage.getItem("token");

            // CHANGE USER ID
            const userId = 2;

            const response = await fetch(

                `http://127.0.0.1:5000/my-tasks/${userId}`,

                {

                    headers: {

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

            const tasks = await response.json();

            const taskContainer =
                document.getElementById("tasks");

            taskContainer.innerHTML = "";

            tasks.forEach(task => {

                taskContainer.innerHTML += `

                    <div class="task">

                        <h2>${task.title}</h2>

                        <p>${task.description}</p>

                        <p>
                            Status:
                            <b>${task.status}</b>
                        </p>

                        <button onclick="completeTask(${task.id})">
                            Mark Completed
                        </button>

                    </div>
                `;
            });
        }

        async function completeTask(taskId) {

            const token =
                localStorage.getItem("token");

            await fetch(

                `http://127.0.0.1:5000/update-task/${taskId}`,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({

                        status: "Completed"
                    })
                }
            );

            loadTasks();
        }

        loadTasks();

    </script>

</body>

</html>
