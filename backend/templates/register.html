<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

</head>

<body>

    <h1>🎬 Register</h1>

    <input id="name" placeholder="Name">

    <input id="email" placeholder="Email">

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <select id="role">

        <option>Director</option>

        <option>Crew</option>

    </select>

    <button onclick="register()">
        Register
    </button>

    <script>

        async function register() {

            await fetch('/register', {

                method: 'POST',

                headers: {

                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({

                    name:
                        document.getElementById(
                            'name'
                        ).value,

                    email:
                        document.getElementById(
                            'email'
                        ).value,

                    password:
                        document.getElementById(
                            'password'
                        ).value,

                    role:
                        document.getElementById(
                            'role'
                        ).value
                })
            });

            alert("Registered Successfully");

            window.location.href =
                '/login-page';
        }

    </script>

</body>

</html>
