<!DOCTYPE html>
<html>

<head>

    <title>AI Production Assistant</title>

    <style>

        body {

            font-family: Arial;

            background: #f4f4f4;

            padding: 30px;
        }

        h1 {

            text-align: center;
        }

        #chat {

            background: white;

            height: 500px;

            overflow-y: auto;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        .message {

            margin-bottom: 20px;
        }

        .user {

            color: blue;
        }

        .ai {

            color: green;
        }

        input {

            width: 80%;

            padding: 15px;

            margin-top: 20px;
        }

        button {

            padding: 15px;

        }
        .navbar {

    background: black;

    padding: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: white;
}

.navbar a {

    color: white;

    margin-right: 20px;

    text-decoration: none;
}

.navbar button {

    background: red;

    border: none;

    padding: 10px 20px;

    color: white;

    cursor: pointer;
}

    </style>

</head>

<body>
<nav class="navbar">

    <h2>🎬 MovieCollab</h2>

    <div>

        <a href="/">Home</a>

        <a href="/director-dashboard-page">
            Dashboard
        </a>

        <a href="/kanban">
            Tasks
        </a>

        <a href="/chat">
            Chat
        </a>

        <a href="/analytics">
            Analytics
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>
    <h1>🤖 AI Production Assistant</h1>

    <div id="chat"></div>

    <input
        type="text"
        id="prompt"
        placeholder="Ask production question..."
    >

    <button onclick="sendPrompt()">
        Send
    </button>

    <script>

        async function sendPrompt() {

            const prompt =
                document.getElementById("prompt").value;

            const chat =
                document.getElementById("chat");

            // USER MESSAGE
            chat.innerHTML += `

                <div class="message user">

                    <b>You:</b> ${prompt}

                </div>
            `;

            // AI RESPONSE
            let aiResponse = "";

            if (
                prompt.includes("schedule")
            ) {

                aiResponse =
                    "AI Suggestion: Schedule outdoor shoots during morning for better lighting.";
            }

            else if (
                prompt.includes("camera")
            ) {

                aiResponse =
                    "AI Suggestion: Use wide-angle shots for cinematic opening scenes.";
            }

            else if (
                prompt.includes("crew")
            ) {

                aiResponse =
                    "AI Suggestion: Keep crew call-time 1 hour before shoot.";
            }

            else {

                aiResponse =
                    "AI Assistant: Production workflow looks good.";
            }

            chat.innerHTML += `

                <div class="message ai">

                    <b>AI:</b> ${aiResponse}

                </div>
            `;

            // AUTO SCROLL
            chat.scrollTop =
                chat.scrollHeight;

            document.getElementById("prompt").value = "";
        }

    </script>

</body>

</html>
