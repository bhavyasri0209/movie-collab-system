<!DOCTYPE html>
<html>

<head>

    <title>Production Calendar</title>

    <style>

        body {

            font-family: Arial;

            background: #f4f4f4;

            padding: 30px;
        }

        h1 {

            text-align: center;
        }

        .schedule {

            background: white;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;

            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        .date {

            color: blue;

            font-weight: bold;
        }
        .navbar {

    background: black;

    padding: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: white;
}

.navbar a {

    color: white;

    margin-right: 20px;

    text-decoration: none;
}

.navbar button {

    background: red;

    border: none;

    padding: 10px 20px;

    color: white;

    cursor: pointer;
}
    </style>

</head>

<body>
<nav class="navbar">

    <h2>🎬 MovieCollab</h2>

    <div>

        <a href="/">Home</a>

        <a href="/director-dashboard-page">
            Dashboard
        </a>

        <a href="/kanban">
            Tasks
        </a>

        <a href="/chat">
            Chat
        </a>

        <a href="/analytics">
            Analytics
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</nav>
    <h1>🎬 Production Schedule Calendar</h1>

    <div id="schedules"></div>

    <script>

        async function loadSchedules() {

            const token =
                localStorage.getItem("token");

            // CHANGE PROJECT ID
            const projectId = 1;

            const response = await fetch(

                `http://127.0.0.1:5000/schedules/${projectId}`,

                {

                    headers: {

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

            const schedules =
                await response.json();

            const container =
                document.getElementById("schedules");

            container.innerHTML = "";

            schedules.forEach(schedule => {

                container.innerHTML += `

                    <div class="schedule">

                        <h2>${schedule.title}</h2>

                        <p class="date">
                            📅 ${schedule.shoot_date}
                        </p>

                        <p>
                            📍 ${schedule.location}
                        </p>

                        <p>
                            ⏰ ${schedule.start_time}
                            -
                            ${schedule.end_time}
                        </p>

                        <p>
                            ${schedule.description}
                        </p>

                    </div>
                `;
            });
        }

        loadSchedules();

    </script>

</body>

</html>
